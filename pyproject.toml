[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-translation-toolkit"
version = "0.2.0"
description = "Structure-first PDF ebook translation toolkit for Chinese HTML, Markdown, and Obsidian editions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24", "PyYAML>=6.0", "Jinja2>=3.1", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["playwright>=1.49"]

[project.scripts]
ebook-translate = "ebook_translation_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebook_translation_toolkit = ["py.typed"]
